[project]
name = "momus-collective-backend"
version = "0.1.0"
description = "momus collective storefront backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "djangorestframework-simplejwt>=5.5.1",
    "google-auth[requests]>=2.58.1",
    "django-redis>=7.0.0",
    "django-cors-headers>=4.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pillow>=12.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# Django-generated, not hand-authored; formatting them serves no one.
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107"]
"**/test_*.py" = ["S101", "S105", "S106", "S107"]
"**/settings.py" = ["S105"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
