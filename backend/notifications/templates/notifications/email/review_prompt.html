<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px 16px;background:#0b0b0c;color:#f4f4f5;font-family:Helvetica,Arial,sans-serif;">
  <p style="font-size:20px;font-weight:bold;margin:0 0 8px;">How's your shirt?</p>
  <p style="font-size:14px;color:#a1a1aa;margin:0 0 16px;">Order {{ order.order_number }}</p>
  <p style="font-size:14px;line-height:1.5;">A quick review helps other people pick their next shirt.</p>
  {% for link in links %}
  <p style="margin:12px 0;"><a href="{{ link.url }}" style="display:inline-block;background:#fbbf24;color:#000;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:6px;">Review &ldquo;{{ link.slogan }}&rdquo;</a></p>
  {% endfor %}
  <p style="color:#71717a;font-size:12px;">momus collective</p>
</body>
</html>
