<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px 16px;background:#0b0b0c;color:#f4f4f5;font-family:Helvetica,Arial,sans-serif;">
  <p style="font-size:20px;font-weight:bold;margin:0 0 8px;">We can't print your design as it is.</p>
  <p style="font-size:14px;color:#a1a1aa;margin:0 0 16px;">Order {{ order.order_number }}</p>
  <p style="font-size:14px;line-height:1.5;margin:0;"><strong>Reason:</strong> {{ reason }}</p>
  {% if details %}<p style="font-size:14px;line-height:1.5;">{{ details }}</p>{% endif %}
  <p style="font-size:14px;line-height:1.5;">You can revise your design and send it back to us, or ask for a full refund.</p>
  <p><a href="{{ tracking_url }}" style="display:inline-block;background:#fbbf24;color:#000;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:6px;">Revise or get a refund</a></p>
  <p style="color:#71717a;font-size:12px;">momus collective</p>
</body>
</html>
