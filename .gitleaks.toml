# Baselined 2026-09-26 against full history: no leaks. The allowlist is
# empty because history is verified clean, not unfinished. Never add an
# entry without saying why the matched value authenticates nothing.

[extend]
useDefault = true

[allowlist]
description = "Verified empty as of 2026-09-26. See header."

# Asset binaries: JPEG/PNG entropy triggers generic high-entropy rules.
# These are brand images, not credentials. Scoped to the assets directory
# and to image extensions only, so a stray .env in assets/ is still scanned.
paths = [
  '''assets/.*\.(jpg|jpeg|png|webp)$''',
]

# Intentionally NO regex allowlist entries. If .env.example is ever
# flagged, narrow by BOTH path and pattern: a bare path allowlist over a
# config file blinds the scan to a real token pasted into it later.
